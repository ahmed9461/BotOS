name: TDLib native runtime
on:
  pull_request:
    paths:
      - 'native/**'
      - 'scripts/build_tdlib.sh'
      - '.github/workflows/tdlib-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore exact native outputs
        id: native-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: native/output/${{ matrix.abi }}
          key: botos-native-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('native/dependencies.lock.json', 'scripts/build_tdlib.sh') }}
      - name: Fetch pinned protocol and official binding
        run: bash scripts/build_tdlib.sh '${{ matrix.abi }}' --prepare
      - name: Publish inspectable source contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TDLib-contract-${{ matrix.abi }}-${{ github.run_number }}
          path: native/output/${{ matrix.abi }}/metadata/
          if-no-files-found: error
          retention-days: 30
      - name: Configure native build dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gperf ninja-build libssl-dev zlib1g-dev pkg-config
          bash scripts/install_android_sdk.sh 'ndk;29.0.14206865' > /tmp/botos-ndk-setup.txt 2>&1 || { tail -n 30 /tmp/botos-ndk-setup.txt; exit 1; }
      - name: Build official JSONJava bridge
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_tdlib.sh '${{ matrix.abi }}' --build
      - name: Verify cached or built outputs
        working-directory: native/output/${{ matrix.abi }}
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish native runtime and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TDLib-native-${{ matrix.abi }}-${{ github.run_number }}
          path: native/output/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 30
