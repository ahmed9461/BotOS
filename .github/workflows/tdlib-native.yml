name: TDLib native runtime
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore exact native outputs
        id: native-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: native/output/${{ matrix.abi }}
          key: botos-native-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('native/dependencies.lock.json', 'scripts/build_tdlib.sh') }}
      - name: Fetch pinned protocol and official binding
        run: bash scripts/build_tdlib.sh '${{ matrix.abi }}' --prepare
      - name: Publish inspectable source contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TDLib-contract-${{ matrix.abi }}-${{ github.run_number }}
          path: native/output/${{ matrix.abi }}/metadata/
          if-no-files-found: error
          retention-days: 30
      - name: Configure native build dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gperf ninja-build libssl-dev zlib1g-dev pkg-config
          bash scripts/install_android_sdk.sh 'ndk;29.0.14206865' > /tmp/botos-ndk-setup.txt 2>&1 || { tail -n 30 /tmp/botos-ndk-setup.txt; exit 1; }
      - name: Build official JSONJava bridge
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_tdlib.sh '${{ matrix.abi }}' --build
      - name: Verify cached or built outputs
        working-directory: native/output/${{ matrix.abi }}
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish native runtime and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TDLib-native-${{ matrix.abi }}-${{ github.run_number }}
          path: native/output/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 30
  verify-runtime:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '9.6.1'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: TDLib-native-arm64-v8a-${{ github.run_number }}
          path: native/output/arm64-v8a
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: TDLib-native-x86_64-${{ github.run_number }}
          path: native/output/x86_64
      - name: Verify pinned native contract and unchanged design
        run: |
          python3 scripts/check_tdlib_contract.py
          python3 scripts/check_repo.py --base "${{ github.event.pull_request.base.sha || github.event.before }}"
          python3 -m unittest discover -s scripts/tests -v
          bash -n scripts/install_android_sdk.sh
          bash -n scripts/run_ui_tests.sh
          python3 scripts/probe_dependencies.py
          python3 scripts/check_contrast.py
          python3 scripts/check_ui_contract.py
      - name: Configure Android and official wrapper
        run: |
          bash scripts/install_android_sdk.sh 'platforms;android-37.0' 'build-tools;36.0.0' > /tmp/botos-sdk-setup.txt 2>&1 || { tail -n 30 /tmp/botos-sdk-setup.txt; exit 1; }
          gradle --no-daemon wrapper --gradle-version 9.6.1 --distribution-type bin --gradle-distribution-sha256-sum 9c0f7faeeb306cb14e4279a3e084ca6b596894089a0638e68a07c945a32c9e14
      - name: Compile and lint runtime and device tests
        run: ./gradlew --no-daemon --console=plain :core:model:test :core:telegram:test :core:tdlib:lintDebug :core:tdlib:assembleDebug :core:tdlib:assembleDebugAndroidTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Test real JNI and Keystore alongside approved UI
        run: bash scripts/run_ui_tests.sh :core:tdlib:connectedDebugAndroidTest
      - name: Require actual runtime and UI evidence
        run: |
          python3 scripts/check_device_evidence.py
          python3 scripts/check_runtime_evidence.py
      - name: Archive unconfigured integration APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/BotOS-0.3.0-account-unconfigured.apk
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
      - name: Publish unconfigured test build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BotOS-integration-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Archive exact tested source
        if: always()
        run: |
          mkdir -p diagnostics
          git archive -o diagnostics/runtime-source.zip HEAD
      - name: Publish runtime test reports and AAR
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BotOS-runtime-checks-${{ github.run_number }}
          retention-days: 30
          path: |
            diagnostics/
            core/telegram/build/test-results/
            core/model/build/test-results/
            core/tdlib/build/reports/
            core/tdlib/build/outputs/androidTest-results/
            core/tdlib/build/outputs/aar/
            app/build/outputs/androidTest-results/
            app/build/reports/lint-results-debug.*
