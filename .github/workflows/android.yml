name: Android foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  integration:
    # One native+app pipeline. No secrets passed from a pull request, even from the same repo.
    uses: ./.github/workflows/tdlib-native.yml
