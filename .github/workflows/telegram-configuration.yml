name: Telegram build configuration
on:
  push:
    branches: [feat/telegram-connection]
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/main/kotlin/com/ahmed9461/botos/TelegramBuildConfiguration.kt'
      - 'scripts/telegram_build_config.py'
      - 'scripts/tests/test_telegram_build_config.py'
      - '.github/workflows/telegram-configuration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-config-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  verify-configuration:
    # Never execute secret-bearing work on pull_request or pull_request_target.
    if: >-
      github.repository == 'ahmed9461/BotOS' &&
      github.actor == 'ahmed9461' &&
      github.ref == 'refs/heads/feat/telegram-connection' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '9.6.1'
          cache-disabled: true
          dependency-graph: disabled
      - name: Test validators without credentials
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Prepare Android platform
        run: |
          bash scripts/install_android_sdk.sh 'platforms;android-37.0' 'build-tools;36.0.0' > /tmp/botos-config-sdk.txt 2>&1 || { tail -n 30 /tmp/botos-config-sdk.txt; exit 1; }
      - name: Verify injected configuration without disclosing values
        env:
          BOTOS_TELEGRAM_API_ID: ${{ secrets.BOTOS_TELEGRAM_API_ID }}
          BOTOS_TELEGRAM_API_HASH: ${{ secrets.BOTOS_TELEGRAM_API_HASH }}
          BOTOS_REQUIRE_TELEGRAM_CONFIG: 'true'
        run: |
          python3 scripts/telegram_build_config.py --require
          gradle --no-daemon --no-build-cache --no-configuration-cache --console=plain :app:generateDebugBuildConfig
          python3 scripts/telegram_build_config.py --require --verify-generated app/build/generated
      - name: Remove generated configuration from the disposable runner
        if: always()
        run: rm -rf app/build .gradle/configuration-cache
      # No upload-artifact or cache save. In particular, do not publish BuildConfig.java.
